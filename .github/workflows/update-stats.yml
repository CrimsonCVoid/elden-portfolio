name: Update follower stats

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 7:17am ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh stats.json
        run: python scripts/update_stats.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet stats.json; then
            git config user.name "stats-bot"
            git config user.email "wcarterbrady00@gmail.com"
            git add stats.json
            git commit -m "chore: refresh follower stats"
            git push
          else
            echo "No stat changes today."
          fi
